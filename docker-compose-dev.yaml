version: "3.9"
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upage}
      POSTGRES_DB: ${POSTGRES_DB:-upage}
    volumes:
      - upage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upage} -d ${POSTGRES_DB:-upage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  upage:
    image: upage-ai:production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-upage}:${POSTGRES_PASSWORD:-upage}@postgres:5432/${POSTGRES_DB:-upage}?schema=public
      - OPERATING_ENV=${OPERATING_ENV:-production}
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - PROVIDER_BASE_URL=${PROVIDER_BASE_URL}
      - PROVIDER_API_KEY=${PROVIDER_API_KEY}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL}
      - LLM_MINOR_MODEL=${LLM_MINOR_MODEL}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT}
      - LOGTO_APP_ID=${LOGTO_APP_ID}
      - LOGTO_APP_SECRET=${LOGTO_APP_SECRET}
      - LOGTO_COOKIE_SECRET=${LOGTO_COOKIE_SECRET}
      - LOGTO_BASE_URL=${LOGTO_BASE_URL}
      - LOGTO_ENABLE=${LOGTO_ENABLE:-false}
      - USAGE_LOG_FILE=true
      - STORAGE_DIR=/app/storage
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-5}
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage

volumes:
  upage-pgdata:

# 独立的 PostgreSQL 服务,供本地 pnpm dev 连接使用
# 启动: docker compose -f docker-compose.db.yaml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: upage-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upage}
      POSTGRES_DB: ${POSTGRES_DB:-upage}
    volumes:
      - upage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upage} -d ${POSTGRES_DB:-upage}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  upage-pgdata:
